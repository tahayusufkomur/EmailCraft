server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the HTML on every load so a deploy reaches the embedded
    # builder right away; hashed /assets/ files stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
