services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mailcraft}
      POSTGRES_USER: ${DB_USER:-mailcraft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailcraft} -d ${DB_NAME:-mailcraft}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.prod.Dockerfile
    env_file:
      - ../.env.prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: docker/backend.prod.Dockerfile
    command: celery -A emailBuilder worker --loglevel=info
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.prod.Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  builder:
    build:
      context: ..
      dockerfile: docker/builder.prod.Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - builder
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
