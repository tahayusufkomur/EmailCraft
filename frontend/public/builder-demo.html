<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock" />
    <title>MailCraft Builder Demo</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --panel: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --border: #d0d7e2;
        --accent: #0f62fe;
        --builder-desktop-width: 1220px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #dbeafe 0%, var(--bg) 45%);
        color: var(--ink);
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 30px;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .panel {
        margin-top: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      .controls {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      input {
        width: 100%;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
      }

      select {
        width: 100%;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
      }

      .toggle-row {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-size: 13px;
      }

      .toggle input {
        width: auto;
        height: auto;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-secondary {
        background: #e2e8f0;
        color: #0f172a;
      }

      #status {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
      }

      .frame-shell {
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow-x: auto;
        overflow-y: hidden;
        background: #fff;
        min-height: 700px;
      }

      #builder-frame {
        width: max(100%, var(--builder-desktop-width));
        min-width: var(--builder-desktop-width);
        height: 700px;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MailCraft Builder E2E Demo</h1>
      <p>
        Launch iframe with your demo API key, edit/save in the builder, and test variable-driven content
        like <code>{{ user_name }}</code> and <code>{{ user_email }}</code>.
      </p>

      <section class="panel">
        <div class="controls">
          <label>
            API key
            <input id="api-key" placeholder="mc_test_..." />
          </label>
          <label>
            User name
            <input id="user-name" value="Jane Example" />
          </label>
          <label>
            User email
            <input id="user-email" value="jane@example.com" />
          </label>
          <label>
            Chrome theme mode
            <select id="theme-mode">
              <option value="system" selected>System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </div>
        <div class="toggle-row">
          <label class="toggle">
            <input id="show-logo" type="checkbox" checked />
            Show logo
          </label>
          <label class="toggle">
            <input id="show-export" type="checkbox" checked />
            Show Export HTML button
          </label>
        </div>
        <div class="actions">
          <button id="launch-btn" class="btn-primary">Launch Builder Iframe</button>
        </div>
        <div id="status">Status: idle</div>
      </section>

      <section class="panel">
        <div class="frame-shell">
          <iframe id="builder-frame" title="MailCraft Builder"></iframe>
        </div>
      </section>
    </main>

    <script>
      const apiKeyInput = document.getElementById('api-key');
      const userNameInput = document.getElementById('user-name');
      const userEmailInput = document.getElementById('user-email');
      const showLogoInput = document.getElementById('show-logo');
      const showExportInput = document.getElementById('show-export');
      const themeModeSelect = document.getElementById('theme-mode');
      const launchBtn = document.getElementById('launch-btn');
      const builderFrame = document.getElementById('builder-frame');
      const statusEl = document.getElementById('status');
      const SETTINGS_STORAGE_KEY = 'mailcraft_builder_demo_settings_v1';

      function readSettingsFromUi() {
        return {
          apiKey: apiKeyInput.value,
          userName: userNameInput.value,
          userEmail: userEmailInput.value,
          showLogo: showLogoInput.checked,
          showExportHtmlButton: showExportInput.checked,
          themeMode: themeModeSelect.value,
        };
      }

      function persistSettings() {
        try {
          localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(readSettingsFromUi()));
        } catch (_error) {
          // Ignore persistence failures in constrained browser modes.
        }
      }

      function restorePersistedSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return;

          if (typeof parsed.apiKey === 'string') apiKeyInput.value = parsed.apiKey;
          if (typeof parsed.userName === 'string') userNameInput.value = parsed.userName;
          if (typeof parsed.userEmail === 'string') userEmailInput.value = parsed.userEmail;
          if (typeof parsed.showLogo === 'boolean') {
            showLogoInput.checked = parsed.showLogo;
          } else if (typeof parsed.hideLogo === 'boolean') {
            showLogoInput.checked = !parsed.hideLogo;
          }
          if (typeof parsed.showExportHtmlButton === 'boolean') {
            showExportInput.checked = parsed.showExportHtmlButton;
          }
          if (
            parsed.themeMode === 'light' ||
            parsed.themeMode === 'dark' ||
            parsed.themeMode === 'system'
          ) {
            themeModeSelect.value = parsed.themeMode;
          }
        } catch (_error) {
          // Ignore invalid persisted payloads.
        }
      }

      restorePersistedSettings();

      const params = new URLSearchParams(window.location.search);
      const apiKeyFromUrl = params.get('apiKey');
      if (apiKeyFromUrl) {
        apiKeyInput.value = apiKeyFromUrl;
      }
      const themeModeFromUrl = params.get('themeMode');
      if (themeModeFromUrl === 'light' || themeModeFromUrl === 'dark' || themeModeFromUrl === 'system') {
        themeModeSelect.value = themeModeFromUrl;
      }
      persistSettings();

      const demoTemplate = {
        version: 1,
        settings: {
          backgroundColor: '#f4f7fb',
          contentWidth: 600,
          defaultFont: 'Arial, Helvetica, sans-serif',
          defaultFontSize: 14,
          defaultColor: '#0f172a',
        },
        header: {
          blocks: [
            {
              id: 'demo-header-1',
              type: 'text',
              data: {
                html: '<p style="margin:0;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">MailCraft Builder Demo</p>',
                variables: [],
              },
              style: {
                padding: { top: 24, right: 24, bottom: 8, left: 24 },
                alignment: 'center',
              },
            },
          ],
        },
        body: {
          blocks: [
            {
              id: 'demo-body-1',
              type: 'text',
              data: {
                html:
                  '<h2 style="margin:0 0 12px 0;font-size:24px;">Hello {{user_name}},</h2>' +
                  '<p style="margin:0 0 8px 0;">This template uses dynamic variables and a custom HTML block.</p>' +
                  '<p style="margin:0;">Email on file: <strong>{{user_email}}</strong></p>',
                variables: ['user_name', 'user_email'],
              },
              style: {
                padding: { top: 12, right: 24, bottom: 16, left: 24 },
                alignment: 'left',
              },
            },
            {
              id: 'demo-body-2',
              type: 'html',
              data: {
                html:
                  '<div style="border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;">' +
                  '<iframe src="https://example.com/embed?user_name={{user_name}}&user_email={{user_email}}" title="Demo Embedded Iframe" width="100%" height="180" style="border:0;display:block;"></iframe>' +
                  '</div>',
              },
              style: {
                padding: { top: 0, right: 24, bottom: 16, left: 24 },
                alignment: 'left',
              },
            },
          ],
        },
        footer: { blocks: [] },
      };

      const state = {
        templateJson: demoTemplate,
      };

      function setStatus(message) {
        statusEl.textContent = `Status: ${message}`;
      }

      function postInit() {
        if (!builderFrame.contentWindow) return;
        builderFrame.contentWindow.postMessage(
          {
            source: 'mailcraft-host',
            type: 'MAILCRAFT_INIT',
            payload: {
              variables: [
                {
                  key: 'user_name',
                  label: 'User Name',
                  defaultValue: userNameInput.value,
                  type: 'text',
                },
                {
                  key: 'user_email',
                  label: 'User Email',
                  defaultValue: userEmailInput.value,
                  type: 'text',
                },
              ],
              templateJson: state.templateJson,
              context: {
                showLogo: showLogoInput.checked,
                showExportHtmlButton: showExportInput.checked,
                themeMode: themeModeSelect.value,
              },
            },
          },
          window.location.origin
        );
      }

      function launchBuilder() {
        const key = apiKeyInput.value.trim();
        if (!key) {
          setStatus('missing API key');
          return;
        }

        const src = `/builder/?apiKey=${encodeURIComponent(key)}`;
        const currentSrc = builderFrame.getAttribute('src') || '';

        // If the same builder session is already loaded, just re-apply init context.
        if (currentSrc === src) {
          postInit();
          setStatus('settings applied to running iframe');
          return;
        }

        builderFrame.src = src;
        setStatus('iframe launched, waiting for MAILCRAFT_READY');
      }

      launchBtn.addEventListener('click', () => {
        persistSettings();
        launchBuilder();
      });
      showLogoInput.addEventListener('change', () => {
        persistSettings();
        launchBuilder();
      });
      showExportInput.addEventListener('change', () => {
        persistSettings();
        launchBuilder();
      });
      themeModeSelect.addEventListener('change', () => {
        persistSettings();
        launchBuilder();
      });
      userNameInput.addEventListener('change', () => {
        persistSettings();
        launchBuilder();
      });
      userEmailInput.addEventListener('change', () => {
        persistSettings();
        launchBuilder();
      });
      apiKeyInput.addEventListener('change', () => {
        persistSettings();
        launchBuilder();
      });
      apiKeyInput.addEventListener('input', persistSettings);
      userNameInput.addEventListener('input', persistSettings);
      userEmailInput.addEventListener('input', persistSettings);
      apiKeyInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          persistSettings();
          launchBuilder();
        }
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        const data = event.data;
        if (!data || data.source !== 'mailcraft') return;

        if (data.type === 'MAILCRAFT_READY') {
          setStatus('builder ready, sending MAILCRAFT_INIT');
          postInit();
          return;
        }

        if (data.type === 'MAILCRAFT_SAVE') {
          if (data.payload?.json) {
            state.templateJson = data.payload.json;
          }
          setStatus('MAILCRAFT_SAVE received');
          return;
        }

        if (data.type === 'MAILCRAFT_AUTO_SAVE') {
          if (data.payload?.json) {
            state.templateJson = data.payload.json;
          }
          setStatus('auto-save update received');
          return;
        }

        if (data.type === 'MAILCRAFT_ERROR') {
          const message = data.payload?.message || 'unknown error';
          setStatus(`builder error: ${message}`);
        }
      });

      if (apiKeyInput.value) {
        launchBuilder();
      }
    </script>
  </body>
</html>
