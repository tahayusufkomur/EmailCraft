services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailcraft
      POSTGRES_USER: mailcraft
      POSTGRES_PASSWORD: mailcraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "mailcraft"
      DB_USER: "mailcraft"
      DB_PASSWORD: "mailcraft"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    depends_on:
      - postgres
    expose:
      - "8000"

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "/api"
      VITE_HMR_HOST: "localhost"
      VITE_HMR_CLIENT_PORT: "80"
      VITE_HMR_PROTOCOL: "ws"
    depends_on:
      - backend
    expose:
      - "5173"
    ports:
      - "5173:5173"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
