services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-mailcraft}
      POSTGRES_USER: ${DB_USER:-mailcraft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailcraft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-mailcraft}
      DB_USER: ${DB_USER:-mailcraft}
      DB_PASSWORD: ${DB_PASSWORD:-mailcraft}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      - postgres
    expose:
      - "8000"

  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "/api"
      VITE_HMR_HOST: "localhost"
      VITE_HMR_CLIENT_PORT: "80"
      VITE_HMR_PROTOCOL: "ws"
      VITE_HMR_PATH: "/__hmr_site"
    depends_on:
      - backend
    expose:
      - "5173"
    ports:
      - "5173:5173"

  frontend_email_builder:
    build: ./frontend-email-builder
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174 --strictPort"
    volumes:
      - ./frontend-email-builder:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "/api"
      VITE_HMR_HOST: "localhost"
      VITE_HMR_CLIENT_PORT: "80"
      VITE_HMR_PROTOCOL: "ws"
      VITE_HMR_PATH: "/__hmr_builder"
    depends_on:
      - backend
    expose:
      - "5174"
    ports:
      - "5174:5174"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - frontend_email_builder

volumes:
  postgres_data:
