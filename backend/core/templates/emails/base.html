<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block subject %}MailCraft{% endblock %}</title>
  <!--[if mso]>
  <style>table{border-collapse:collapse;}td{font-family:Arial,sans-serif;}</style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f5f2ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  {% block preheader %}
  <span style="display:none;font-size:1px;color:#f5f2ed;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {% block preheader_text %}{% endblock %}
  </span>
  {% endblock %}

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f2ed;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <span style="font-size:24px;font-weight:700;color:#191e2b;letter-spacing:-0.5px;">MailCraft</span>
            </td>
          </tr>

          <!-- Content card -->
          <tr>
            <td style="background-color:#fefefc;border-radius:8px;padding:40px 32px;border:1px solid #d9d1c5;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:12px;color:#575c65;">
                MailCraft &mdash; <a href="https://mailcraft.contentor.app" style="color:#0c6fc2;text-decoration:underline;">mailcraft.contentor.app</a>
              </p>
              <p style="margin:8px 0 0;font-size:12px;color:#888e96;">
                You received this email because of activity on your MailCraft account.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
